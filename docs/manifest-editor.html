<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geodeta Suite Manifest Editor</title>
<style>

</style></head><body>
<header class="topbar"><div class="brand"><div class="mark"></div>Geodeta Suite Manifest Editor</div><div class="actions"><button class="btn" id="backBtn">Back to Site Editor</button><button class="btn" id="jsonToggle">Show JSON</button><span class="commit-status" id="commitStatus" role="status" aria-live="polite"></span><button class="btn primary" id="commitBtn" disabled>Commit manifest.json</button></div></header>
<div class="shell" id="shell"><aside class="sidebar"><div class="side-title">Repository</div><div class="nav active">simplist1/gbengtools <span class="badge">main</span></div><div class="side-title">Search</div><input id="search" class="search" placeholder="Search tools..."><div class="side-title">Categories</div><div class="nav active" data-view="plugins">Plugins</div><div class="nav" data-view="scripts">Scripts</div><div class="nav" data-view="apps">Apps</div><button class="btn primary" style="width:100%;margin-top:18px" id="addSub">+ Add subcategory</button><button class="btn" style="width:100%;margin-top:8px" id="addTool">+ Add tool</button></aside><main class="main"><div class="hero"><h1>Installer library</h1><div class="sub">Manage plugin, script, and app compatibility.</div></div><div class="tabs"><button class="tab active" data-tab="plugins"><div class="tab-icon">PL</div><h3>Plugins</h3><p>AutoCAD add-ins and plugin families</p></button><button class="tab" data-tab="scripts"><div class="tab-icon">SC</div><h3>Scripts</h3><p>Drafting, point, and miscellaneous utilities</p></button><button class="tab" data-tab="apps"><div class="tab-icon">AP</div><h3>Apps</h3><p>Standalone applications</p></button></div><section class="panel"><div class="panel-head"><h2 id="title">Plugins</h2><button class="btn" id="collapse">Collapse all</button></div><div id="content"></div></section></main><aside class="json-panel"><div class="json-head"><strong>manifest.json</strong><span class="valid" id="valid">● Valid JSON</span></div><textarea id="json"></textarea><div class="json-foot" id="status">Loading manifest.json...</div></aside></div><div class="page-reveal"><div class="reveal-orange"></div><div class="reveal-black"></div></div>
<script>

const PRODUCTS=['AutoCAD','Civil 3D','AutoCAD LT','Land Desktop'],WINDOWS=['Windows 10','Windows 11'];let manifest={schemaVersion:1,categories:[]},active='plugins',openSubs=new Set(),editing=new Set(),authed=false,loaded=false,dirty=false,saving=false;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function category(id){return manifest.categories.find(c=>c.id===id)}function normalize(m){m=m&&typeof m==='object'?m:{schemaVersion:1,categories:[]};m.categories=Array.isArray(m.categories)?m.categories:[];m.categories.forEach(c=>{if(c.id==='apps'){c.tools=Array.isArray(c.tools)?c.tools:[];c.tools.forEach(t=>{t.windowsSupport=Array.isArray(t.windowsSupport)&&t.windowsSupport.length?t.windowsSupport:['Windows 10','Windows 11'];delete t.products;delete t.minimumYear;delete t.maximumYear})}else{c.subcategories=Array.isArray(c.subcategories)?c.subcategories:[];c.subcategories.forEach(s=>(s.tools||[]).forEach(t=>{if(!Array.isArray(t.compatibility)||!t.compatibility.length)t.compatibility=[{products:Array.isArray(t.products)&&t.products.length?t.products:['AutoCAD'],minimumYear:Number(t.minimumYear)||2020,maximumYear:t.maximumYear==null?null:Number(t.maximumYear)}];delete t.products;delete t.minimumYear;delete t.maximumYear}))}});return m}
function setStatus(x){$('status').textContent=x||''}function setCommitStatus(text,type=''){$('commitStatus').textContent=text||'';$('commitStatus').className='commit-status'+(type?' '+type:'')}function updateCommit(){$('commitBtn').disabled=!(authed&&loaded&&!saving)}function sync(mark=true){$('json').value=JSON.stringify(manifest,null,2);if(mark){dirty=true;setStatus('Unsaved manifest changes.')}updateCommit()}function years(r){return r.maximumYear==null?`${r.minimumYear}+`:Number(r.minimumYear)===Number(r.maximumYear)?String(r.minimumYear):`${r.minimumYear}–${r.maximumYear}`}function pencil(type,key){return `<button class="edit-icon" data-edit="${type}" data-key="${key}" title="Edit metadata"><img src="${PENCIL}" alt="Edit"></button>`}function toolAt(c,s,t){const cat=manifest.categories[c];return s===''?cat.tools[t]:cat.subcategories[s].tools[t]}function tags(t,cat){return cat==='apps'?(t.windowsSupport||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join(''):(t.compatibility||[]).map(r=>`<span class="tag">${esc(r.products.join(' / '))} ${years(r)}</span>`).join('')}
function commonFields(t,c,s,ti){return `<div class="field"><label>Name</label><input data-tool="name" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.name)}"></div><div class="field"><label>ID</label><input data-tool="id" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.id)}"></div><div class="field"><label>Version</label><input data-tool="version" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.version)}"></div><div class="field"><label>Runtime</label><input data-tool="runtime" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.runtime)}"></div>`}function compatRows(t,c,s,ti){return t.compatibility.map((r,ri)=>`<div class="compat-row"><div class="field products-field"><label>Products</label><div class="product-checks">${PRODUCTS.map(p=>`<label class="check-pill"><input type="checkbox" data-product="${p}" data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" ${r.products.includes(p)?'checked':''}>${p}</label>`).join('')}</div></div><div class="field"><label>Minimum year</label><input type="number" data-compat="minimumYear" data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" value="${r.minimumYear}"></div><div class="field"><label>Maximum year</label><input type="number" data-compat="maximumYear" data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" value="${r.maximumYear??''}" placeholder="No maximum"></div><button class="remove-compat" data-remove data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" ${t.compatibility.length===1?'disabled':''}>Remove</button></div>`).join('')}function editor(t,c,s,ti,cat){if(cat==='apps')return `<div class="tool-edit"><div class="field-grid">${commonFields(t,c,s,ti)}<div class="field full"><label>Windows support</label><div class="windows-checks">${WINDOWS.map(w=>`<label class="check-pill"><input type="checkbox" data-windows="${w}" data-c="${c}" data-s="${s}" data-t="${ti}" ${(t.windowsSupport||[]).includes(w)?'checked':''}>${w}</label>`).join('')}</div></div></div></div>`;return `<div class="tool-edit"><div class="field-grid">${commonFields(t,c,s,ti)}<div class="compat-list">${compatRows(t,c,s,ti)}</div><div class="compat-actions"><button class="btn small" data-addcompat data-c="${c}" data-s="${s}" data-t="${ti}">+ Add app compatibility</button></div></div></div>`}function row(t,c,s,ti,cat){const key=`${c}:${s}:${ti}`;return `<div class="tool-row ${editing.has(key)?'editing':''}" data-row="${key}"><div class="checkbox"></div><div><h4>${esc(t.name)}</h4><div class="meta">${esc(t.runtime)} · v${esc(t.version)}</div></div><div class="tags">${tags(t,cat)}</div>${pencil('tool',key)}${editor(t,c,s,ti,cat)}</div>`}
function render(){const cat=category(active);if(!cat)return;$('title').textContent=cat.name;const ci=manifest.categories.indexOf(cat),q=$('search').value.toLowerCase();if(active==='apps')$('content').innerHTML=(cat.tools||[]).filter(t=>t.name.toLowerCase().includes(q)).map(t=>row(t,ci,'',cat.tools.indexOf(t),cat.id)).join('');else $('content').innerHTML=(cat.subcategories||[]).map((s,si)=>{const tools=(s.tools||[]).filter(t=>t.name.toLowerCase().includes(q));if(q&&!tools.length&&!s.name.toLowerCase().includes(q))return'';const key=`${ci}:${si}`;return `<div class="subcat ${openSubs.has(key)?'open':''}" data-sub="${key}"><div class="subcat-head"><div class="subcat-title"><span class="arrow">▶</span><strong>${esc(s.name)}</strong><span class="badge">${tools.length}</span></div><div class="subcat-actions"><span class="meta">${esc(s.id)}</span>${pencil('sub',key)}</div></div><div class="inline-editor"><div class="field-grid"><div class="field"><label>Subcategory name</label><input data-subfield="name" data-c="${ci}" data-s="${si}" value="${esc(s.name)}"></div><div class="field"><label>Subcategory ID</label><input data-subfield="id" data-c="${ci}" data-s="${si}" value="${esc(s.id)}"></div></div></div><div class="subcat-body">${tools.map(t=>row(t,ci,si,s.tools.indexOf(t),cat.id)).join('')}</div></div>`}).join('');wire()}
function wire(){document.querySelectorAll('.subcat-head').forEach(h=>h.onclick=e=>{if(e.target.closest('.edit-icon'))return;const box=h.parentElement,key=box.dataset.sub;box.classList.toggle('open');box.classList.contains('open')?openSubs.add(key):openSubs.delete(key)});document.querySelectorAll('[data-edit="sub"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const box=b.closest('.subcat');box.classList.add('open');openSubs.add(box.dataset.sub);box.querySelector('.inline-editor').classList.toggle('open')});document.querySelectorAll('[data-edit="tool"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const box=b.closest('.tool-row'),key=box.dataset.row;box.classList.toggle('editing');box.classList.contains('editing')?editing.add(key):editing.delete(key)});document.querySelectorAll('[data-subfield]').forEach(i=>i.oninput=()=>{manifest.categories[i.dataset.c].subcategories[i.dataset.s][i.dataset.subfield]=i.value;sync()});document.querySelectorAll('[data-tool]').forEach(i=>i.oninput=()=>{toolAt(+i.dataset.c,i.dataset.s,+i.dataset.t)[i.dataset.tool]=i.value;sync()});document.querySelectorAll('[data-compat]').forEach(i=>i.oninput=()=>{const r=toolAt(+i.dataset.c,i.dataset.s,+i.dataset.t).compatibility[+i.dataset.r];r[i.dataset.compat]=i.dataset.compat==='maximumYear'?(i.value===''?null:+i.value):+i.value;sync()});document.querySelectorAll('[data-product]').forEach(i=>i.onchange=()=>{const t=toolAt(+i.dataset.c,i.dataset.s,+i.dataset.t),ri=+i.dataset.r,r=t.compatibility[ri],p=i.dataset.product;if(i.checked&&t.compatibility.some((x,n)=>n!==ri&&x.products.includes(p))){i.checked=false;return alert(`${p} is already assigned to another compatibility row.`)}const set=new Set(r.products);i.checked?set.add(p):set.delete(p);if(!set.size){i.checked=true;return alert('Each compatibility row needs at least one product.')}r.products=PRODUCTS.filter(x=>set.has(x));sync()});document.querySelectorAll('[data-addcompat]').forEach(b=>b.onclick=()=>{const t=toolAt(+b.dataset.c,b.dataset.s,+b.dataset.t),used=new Set(t.compatibility.flatMap(r=>r.products)),p=PRODUCTS.find(x=>!used.has(x));if(!p)return alert('All products are already assigned.');t.compatibility.push({products:[p],minimumYear:2020,maximumYear:null});sync();render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const t=toolAt(+b.dataset.c,b.dataset.s,+b.dataset.t);if(t.compatibility.length===1)return;t.compatibility.splice(+b.dataset.r,1);sync();render()});document.querySelectorAll('[data-windows]').forEach(i=>i.onchange=()=>{const t=toolAt(+i.dataset.c,i.dataset.s,+i.dataset.t),set=new Set(t.windowsSupport||[]);i.checked?set.add(i.dataset.windows):set.delete(i.dataset.windows);if(!set.size){i.checked=true;return alert('At least one Windows version must remain selected.')}t.windowsSupport=WINDOWS.filter(x=>set.has(x));sync()})}
function setActive(id){active=id;document.querySelectorAll('[data-tab],[data-view]').forEach(x=>x.classList.toggle('active',(x.dataset.tab||x.dataset.view)===id));render()}async function auth(){try{const r=await fetch('/api/github/me',{credentials:'include'}),j=await r.json();authed=!!(j.authenticated&&j.allowed);if(!authed)setStatus('GitHub login required. Return to the site editor to sign in.')}catch{authed=false;setStatus('OAuth backend is unavailable.')}updateCommit()}async function load(){setStatus('Loading manifest.json...');try{const r=await fetch('data/manifest.json?sync='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(`Could not load manifest.json: ${r.status}`);manifest=normalize(await r.json());loaded=true;dirty=false;sync(false);render();setStatus('Loaded live manifest.json.')}catch(e){setStatus(e.message)}updateCommit()}async function commit(){if(!authed||!loaded||saving)return;saving=true;updateCommit();setCommitStatus('Committing…');setStatus('Committing manifest.json...');try{const content=JSON.stringify(normalize(manifest),null,2)+'\n',r=await fetch('/api/github/save-manifest',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,message:'Update suite manifest from visual editor'})}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'GitHub save failed');dirty=false;const short=String(j.commit||'').slice(0,7);setCommitStatus(`Done · ${short}`,'success');setStatus(`Committed: ${short}. Deployment triggered; the live file will update shortly.`)}catch(e){setCommitStatus('Commit failed','error');setStatus(e.message)}finally{saving=false;updateCommit()}}
document.querySelectorAll('[data-tab],[data-view]').forEach(x=>x.onclick=()=>setActive(x.dataset.tab||x.dataset.view));$('search').oninput=render;$('collapse').onclick=()=>{openSubs.clear();render()};$('jsonToggle').onclick=()=>{$('shell').classList.toggle('json-open');$('jsonToggle').textContent=$('shell').classList.contains('json-open')?'Hide JSON':'Show JSON'};$('json').oninput=()=>{try{manifest=normalize(JSON.parse($('json').value));dirty=true;$('valid').textContent='● Valid JSON';$('valid').style.color='var(--green)';setStatus('Unsaved manifest changes.');render()}catch{$('valid').textContent='● Invalid JSON';$('valid').style.color='var(--red)';setStatus('Fix invalid JSON before committing.')}updateCommit()};$('backBtn').onclick=()=>{if(dirty&&!confirm('You have unsaved manifest changes. Leave anyway?'))return;dirty=false;location.href='editor.html'};$('commitBtn').onclick=commit;$('addSub').onclick=()=>alert('Subcategory creation modal comes next.');$('addTool').onclick=()=>alert('Tool creation modal comes next.');window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});render();sync(false);Promise.all([auth(),load()]);
</script></body></html>
