<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geodeta Suite Manifest Editor</title>
<style>
:root{--bg:#0d0f0f;--panel:#141716;--panel2:#191d1b;--line:#2a2f2c;--text:#f2f4f3;--muted:#929a95;--accent:#e69b22;--green:#34d399;--red:#ef4444}*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(230,155,34,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}.topbar{height:62px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(13,15,15,.95)}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 20px rgba(230,155,34,.45)}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#211708;border-color:#efb65a}.btn.small{padding:7px 10px;font-size:12px}.shell{height:calc(100vh - 62px);display:grid;grid-template-columns:240px minmax(0,1fr) 0;transition:grid-template-columns .28s ease}.shell.json-open{grid-template-columns:240px minmax(0,1fr) 430px}.sidebar{border-right:1px solid var(--line);background:#101211;padding:18px;overflow:auto}.side-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:10px 0 8px}.nav{padding:10px 12px;border-radius:9px;color:#c6cdc9;margin:4px 0;display:flex;justify-content:space-between}.nav.active,.nav:hover{background:#1b1f1d;color:white}.badge{font-size:11px;background:#292f2c;padding:3px 7px;border-radius:999px}.search{width:100%;background:#0b0d0c;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}.main{overflow:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:31px}.sub{color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.tab{height:132px;border:0;border-radius:14px;background:#171a18;color:var(--text);text-align:left;padding:17px}.tab.active{background:#26212c;outline:1px solid rgba(230,155,34,.35)}.tab-icon{width:42px;height:42px;border-radius:11px;background:#292533;color:#ffc36b;display:grid;place-items:center;font-weight:900}.tab h3{margin:12px 0 4px}.tab p{margin:0;color:var(--muted);font-size:13px}.panel{background:#121513;border:1px solid var(--line);border-radius:15px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h2{margin:0}.subcat{border-radius:12px;background:#171b18;margin:9px 0;overflow:hidden;border:1px solid transparent}.subcat.open{border-color:#343b37}.subcat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;cursor:pointer}.subcat-title{display:flex;gap:10px;align-items:center}.subcat-actions{display:flex;gap:8px;align-items:center}.arrow{transition:.2s}.subcat.open .arrow{transform:rotate(90deg)}.subcat-body{display:none;padding:0 12px 12px}.subcat.open .subcat-body{display:block}.tool-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:13px;align-items:center;background:#121513;border-radius:10px;padding:13px;margin-top:9px}.checkbox{width:22px;height:22px;border-radius:6px;background:#0d100e;border:1px solid #343b37}.tool-row h4{margin:0 0 3px}.meta{font-size:12px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tag{font-size:11px;background:#272d29;border-radius:6px;padding:5px 7px}.edit-icon{width:30px;height:30px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;color:var(--text);display:grid;place-items:center;padding:0}.edit-icon:hover{border-color:var(--accent)}.edit-icon img{width:16px;height:16px;filter:brightness(0) invert(1)}.inline-editor{display:none;border-top:1px solid var(--line);padding:12px;background:#101311}.inline-editor.open{display:block}.tool-edit{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px;display:none}.tool-row.editing .tool-edit{display:block}.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:var(--muted)}.field input{width:100%;background:#0b0d0c;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px}.field input:focus{outline:none;border-color:var(--accent)}.compat-list{grid-column:1/-1;display:grid;gap:8px}.compat-row{display:grid;grid-template-columns:minmax(250px,1fr) 120px 120px auto;gap:8px;align-items:end;border:1px solid var(--line);background:#0d100e;padding:10px;border-radius:9px}.product-checks,.windows-checks{display:flex;gap:8px;flex-wrap:wrap}.check-pill{display:flex!important;align-items:center;gap:5px;background:#171b18;border:1px solid var(--line);padding:7px 8px;border-radius:7px;color:var(--text)!important}.check-pill input{width:auto}.compat-actions{display:flex;gap:8px;align-items:center}.remove-compat{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:8px 10px}.remove-compat:disabled{opacity:.4;cursor:not-allowed}.json-panel{border-left:1px solid var(--line);background:#090b0a;min-width:0;overflow:hidden;display:flex;flex-direction:column}.json-head{height:52px;border-bottom:1px solid var(--line);padding:0 14px;display:flex;justify-content:space-between;align-items:center}.json-head strong{font-family:Consolas,monospace;color:#ffc36b}.valid{font-size:11px;color:var(--green)}textarea{flex:1;resize:none;border:0;outline:0;background:#090b0a;color:#d7ded9;padding:15px;font:13px/1.55 Consolas,monospace}.json-foot{border-top:1px solid var(--line);padding:11px 14px;color:var(--muted);font-size:12px}.page-reveal{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}.reveal-black,.reveal-orange{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(0)}.reveal-black{background:#050606;z-index:2;animation:revealUp .72s .18s cubic-bezier(.76,0,.24,1) forwards}.reveal-orange{background:var(--accent);z-index:1;animation:revealUp .72s .30s cubic-bezier(.76,0,.24,1) forwards}@keyframes revealUp{to{transform:translateY(-100%)}}@media(max-width:900px){.compat-row{grid-template-columns:1fr 1fr}.compat-row .products-field{grid-column:1/-1}}@media(max-width:760px){.field-grid{grid-template-columns:1fr}.tool-row{grid-template-columns:auto minmax(0,1fr) auto}.tags{grid-column:2/-1;justify-content:flex-start}.compat-row{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="mark"></div>Geodeta Suite Manifest Editor</div><div class="actions"><button class="btn" id="backBtn">Back to Site Editor</button><button class="btn" id="jsonToggle">Show JSON</button><button class="btn primary" id="commitBtn">Commit manifest.json</button></div></header>
<div class="shell" id="shell"><aside class="sidebar"><div class="side-title">Repository</div><div class="nav active">simplist1/gbengtools <span class="badge">main</span></div><div class="side-title">Search</div><input id="search" class="search" placeholder="Search tools..."><div class="side-title">Categories</div><div class="nav active" data-view="plugins">Plugins <span class="badge">4</span></div><div class="nav" data-view="scripts">Scripts <span class="badge">6</span></div><div class="nav" data-view="apps">Apps <span class="badge">1</span></div><button class="btn primary" style="width:100%;margin-top:18px" id="addSub">+ Add subcategory</button><button class="btn" style="width:100%;margin-top:8px" id="addTool">+ Add tool</button></aside><main class="main"><div class="hero"><div><h1>Installer library</h1><div class="sub">Manage plugin, script, and app compatibility.</div></div></div><div class="tabs"><button class="tab active" data-tab="plugins"><div class="tab-icon">PL</div><h3>Plugins</h3><p>AutoCAD add-ins and plugin families</p></button><button class="tab" data-tab="scripts"><div class="tab-icon">SC</div><h3>Scripts</h3><p>Drafting, point, and miscellaneous utilities</p></button><button class="tab" data-tab="apps"><div class="tab-icon">AP</div><h3>Apps</h3><p>Standalone applications</p></button></div><section class="panel"><div class="panel-head"><h2 id="title">Plugins</h2><button class="btn" id="collapse">Collapse all</button></div><div id="content"></div></section></main><aside class="json-panel"><div class="json-head"><strong>manifest.json</strong><span class="valid" id="valid">● Valid JSON</span></div><textarea id="json"></textarea><div class="json-foot">Mockup only. GitHub save endpoint comes next.</div></aside></div><div class="page-reveal"><div class="reveal-orange"></div><div class="reveal-black"></div></div>
<script>
const PENCIL='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9ImN1cnJlbnRDb2xvciIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIGNsYXNzPSJsdWNpZGUgbHVjaWRlLXBlbmNpbC1pY29uIGx1Y2lkZS1wZW5jaWwiPjxwYXRoIGQ9Ik0yMS4xNzQgNi44MTJhMSAxIDAgMCAwLTMuOTg2LTMuOTg3TDMuODQyIDE2LjE3NGEyIDIgMCAwIDAtLjUuODNsLTEuMzIxIDQuMzUyYS41LjUgMCAwIDAgLjYyMy42MjJsNC4zNTMtMS4zMmEyIDIgMCAwIDAgLjgzLS40OTd6Ii8+PHBhdGggZD0ibTE1IDUgNCA0Ii8+PC9zdmc+';
const CAD_PRODUCTS=['AutoCAD','Civil 3D','AutoCAD LT','Land Desktop'],WINDOWS_VERSIONS=['Windows 10','Windows 11'];
let manifest={schemaVersion:1,categories:[{id:'plugins',name:'Plugins',subcategories:[{id:'any2dxf',name:'Any2DXF',tools:[{id:'any2dxf-vba',name:'Any2DXF for AutoCAD 2000 and up',version:'1.3.0',runtime:'VBA',compatibility:[{products:['AutoCAD','Civil 3D','Land Desktop'],minimumYear:2000,maximumYear:2026}]},{id:'any2dxf-net47',name:'Any2DXF for AutoCAD 2020',version:'2.1.0',runtime:'.NET 4.7',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2020,maximumYear:2020}]},{id:'any2dxf-net10',name:'Any2DXF for AutoCAD 2027',version:'3.0.0',runtime:'.NET 10',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2027,maximumYear:2027}]},{id:'any2dxf-lt',name:'Any2DXF LT for AutoCAD LT 2024',version:'1.0.0',runtime:'LISP',compatibility:[{products:['AutoCAD LT'],minimumYear:2024,maximumYear:null}]}]}]},{id:'scripts',name:'Scripts',subcategories:[{id:'drafting-utilities',name:'Drafting Utilities',tools:[{id:'contour-labels',name:'Polyline Contour Labels',version:'1.0.0',runtime:'LISP',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2020,maximumYear:null}]},{id:'quick-text',name:'Quick Text Style Changer',version:'1.0.0',runtime:'LISP',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2020,maximumYear:null}]}]},{id:'point-utilities',name:'Point Utilities',tools:[{id:'keyzone',name:'KeyZone Helper',version:'1.0.0',runtime:'LISP',compatibility:[{products:['Civil 3D'],minimumYear:2020,maximumYear:null}]},{id:'quick-10',name:'Quick 10 Scale',version:'1.0.0',runtime:'LISP',compatibility:[{products:['Civil 3D'],minimumYear:2020,maximumYear:null}]}]},{id:'miscellaneous',name:'Miscellaneous',tools:[{id:'least-squares',name:'Least Squares Adjust Objects',version:'1.0.0',runtime:'LISP',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2020,maximumYear:null}]},{id:'easy-spacing',name:'Easy Spacing',version:'1.0.0',runtime:'LISP',compatibility:[{products:['AutoCAD','Civil 3D'],minimumYear:2020,maximumYear:null}]}]}]},{id:'apps',name:'Apps',tools:[{id:'icon-studio',name:'AutoCAD Icon Studio',version:'1.0.0',runtime:'.NET',windowsSupport:['Windows 10','Windows 11']}]}]};
let active='plugins',openSubcategories=new Set(),editingTools=new Set();const $=id=>document.getElementById(id),category=id=>manifest.categories.find(c=>c.id===id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function normalizeManifest(src){src=src||{};(src.categories||[]).forEach(c=>{(c.tools||[]).forEach(t=>normalizeTool(t,c.id));(c.subcategories||[]).forEach(s=>(s.tools||[]).forEach(t=>normalizeTool(t,c.id)))});return src}
function normalizeTool(t,catId){if(catId==='apps'){if(!Array.isArray(t.windowsSupport)||!t.windowsSupport.length)t.windowsSupport=['Windows 10','Windows 11'];delete t.products;delete t.minimumYear;delete t.maximumYear;delete t.compatibility}else{if(!Array.isArray(t.compatibility)||!t.compatibility.length)t.compatibility=[{products:Array.isArray(t.products)&&t.products.length?[...new Set(t.products)]:['AutoCAD'],minimumYear:Number(t.minimumYear)||2020,maximumYear:t.maximumYear==null?null:Number(t.maximumYear)}];t.compatibility=t.compatibility.map(r=>({products:[...new Set(Array.isArray(r.products)?r.products:[])],minimumYear:Number(r.minimumYear)||2020,maximumYear:r.maximumYear==null||r.maximumYear===''?null:Number(r.maximumYear)}));delete t.products;delete t.minimumYear;delete t.maximumYear;delete t.windowsSupport}}
manifest=normalizeManifest(manifest);function syncJson(){$('json').value=JSON.stringify(manifest,null,2)}function years(r){if(r.maximumYear==null)return `${r.minimumYear}+`;return Number(r.minimumYear)===Number(r.maximumYear)?String(r.minimumYear):`${r.minimumYear}–${r.maximumYear}`}function editButton(type,a,b=''){return `<button class="edit-icon" data-edit="${type}" data-a="${a}" data-b="${b}" title="Edit metadata"><img src="${PENCIL}" alt="Edit"></button>`}function compatibilityTags(t,catId){if(catId==='apps')return(t.windowsSupport||[]).map(v=>`<span class="tag">${esc(v)}</span>`).join('');return(t.compatibility||[]).map(r=>`<span class="tag">${esc(r.products.join(' / '))} ${years(r)}</span>`).join('')}function productChecks(r,c,s,t,ri){return CAD_PRODUCTS.map(p=>`<label class="check-pill"><input type="checkbox" data-compat-product="${esc(p)}" data-c="${c}" data-s="${s}" data-t="${t}" data-r="${ri}" ${r.products.includes(p)?'checked':''}>${esc(p)}</label>`).join('')}function compatibilityRows(t,c,s,ti){return t.compatibility.map((r,ri)=>`<div class="compat-row"><div class="field products-field"><label>Products</label><div class="product-checks">${productChecks(r,c,s,ti,ri)}</div></div><div class="field"><label>Minimum year</label><input type="number" data-compat-field="minimumYear" data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" value="${r.minimumYear}"></div><div class="field"><label>Maximum year</label><input type="number" data-compat-field="maximumYear" data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" value="${r.maximumYear??''}" placeholder="No maximum"></div><button class="remove-compat" data-remove-compat data-c="${c}" data-s="${s}" data-t="${ti}" data-r="${ri}" ${t.compatibility.length===1?'disabled':''}>Remove</button></div>`).join('')}
function toolFields(t,c,s,ti,catId){const common=`<div class="field"><label>Name</label><input data-tool-field="name" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.name)}"></div><div class="field"><label>ID</label><input data-tool-field="id" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.id)}"></div><div class="field"><label>Version</label><input data-tool-field="version" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.version)}"></div><div class="field"><label>Runtime</label><input data-tool-field="runtime" data-c="${c}" data-s="${s}" data-t="${ti}" value="${esc(t.runtime)}"></div>`;if(catId==='apps')return `<div class="tool-edit"><div class="field-grid">${common}<div class="field full"><label>Windows support</label><div class="windows-checks">${WINDOWS_VERSIONS.map(v=>`<label class="check-pill"><input type="checkbox" data-windows="${v}" data-c="${c}" data-s="${s}" data-t="${ti}" ${(t.windowsSupport||[]).includes(v)?'checked':''}>${v}</label>`).join('')}</div></div></div></div>`;return `<div class="tool-edit"><div class="field-grid">${common}<div class="compat-list">${compatibilityRows(t,c,s,ti)}</div><div class="compat-actions"><button class="btn small" data-add-compat data-c="${c}" data-s="${s}" data-t="${ti}">+ Add app compatibility</button></div></div></div>`}
function subFields(s,c,si){return `<div class="inline-editor"><div class="field-grid"><div class="field"><label>Subcategory name</label><input data-sub-field="name" data-c="${c}" data-s="${si}" value="${esc(s.name)}"></div><div class="field"><label>Subcategory ID</label><input data-sub-field="id" data-c="${c}" data-s="${si}" value="${esc(s.id)}"></div></div></div>`}function getTool(c,s,t){const cat=manifest.categories[c];return s===''?cat.tools[t]:cat.subcategories[s].tools[t]}function toolKey(c,s,ti){return `${c}:${s}:${ti}`}function row(t,c,s,ti,catId){const key=toolKey(c,s,ti);return `<div class="tool-row ${editingTools.has(key)?'editing':''}" data-tool-key="${key}"><div class="checkbox"></div><div><h4>${esc(t.name)}</h4><div class="meta">${esc(t.runtime)} · v${esc(t.version)}</div></div><div class="tags">${compatibilityTags(t,catId)}</div>${editButton('tool',`${c}:${s}:${ti}`)}${toolFields(t,c,s,ti,catId)}</div>`}
function render(){const c=category(active),ci=manifest.categories.indexOf(c),q=$('search').value.toLowerCase();$('title').textContent=c.name;if(active==='apps'){const tools=c.tools.filter(t=>t.name.toLowerCase().includes(q));$('content').innerHTML=tools.map(t=>row(t,ci,'',c.tools.indexOf(t),c.id)).join('')}else{$('content').innerHTML=c.subcategories.map((s,si)=>{const tools=s.tools.filter(t=>t.name.toLowerCase().includes(q));if(q&&!tools.length&&!s.name.toLowerCase().includes(q))return'';const subKey=`${ci}:${si}`;return `<div class="subcat ${openSubcategories.has(subKey)?'open':''}" data-sub-key="${subKey}"><div class="subcat-head"><div class="subcat-title"><span class="arrow">▶</span><strong>${esc(s.name)}</strong><span class="badge">${tools.length}</span></div><div class="subcat-actions"><span class="meta">${esc(s.id)}</span>${editButton('sub',ci,si)}</div></div>${subFields(s,ci,si)}<div class="subcat-body">${tools.map(t=>row(t,ci,si,s.tools.indexOf(t),c.id)).join('')}</div></div>`}).join('');document.querySelectorAll('.subcat-head').forEach(h=>h.onclick=e=>{if(e.target.closest('.edit-icon'))return;const box=h.parentElement,key=box.dataset.subKey;box.classList.toggle('open');box.classList.contains('open')?openSubcategories.add(key):openSubcategories.delete(key)})}wireEditors()}
function wireEditors(){document.querySelectorAll('[data-edit="sub"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const box=b.closest('.subcat'),key=box.dataset.subKey;box.querySelector('.inline-editor').classList.toggle('open');box.classList.add('open');openSubcategories.add(key)});document.querySelectorAll('[data-edit="tool"]').forEach(b=>b.onclick=e=>{e.stopPropagation();const row=b.closest('.tool-row'),key=row.dataset.toolKey;row.classList.toggle('editing');row.classList.contains('editing')?editingTools.add(key):editingTools.delete(key)});document.querySelectorAll('[data-sub-field]').forEach(i=>i.oninput=()=>{manifest.categories[i.dataset.c].subcategories[i.dataset.s][i.dataset.subField]=i.value;syncJson()});document.querySelectorAll('[data-tool-field]').forEach(i=>i.oninput=()=>{getTool(Number(i.dataset.c),i.dataset.s,Number(i.dataset.t))[i.dataset.toolField]=i.value;syncJson()});document.querySelectorAll('[data-compat-field]').forEach(i=>i.oninput=()=>{const r=getTool(Number(i.dataset.c),i.dataset.s,Number(i.dataset.t)).compatibility[Number(i.dataset.r)];r[i.dataset.compatField]=i.dataset.compatField==='maximumYear'?(i.value===''?null:Number(i.value)):Number(i.value);syncJson()});document.querySelectorAll('[data-compat-product]').forEach(i=>i.onchange=()=>changeProduct(i));document.querySelectorAll('[data-add-compat]').forEach(b=>b.onclick=()=>{const t=getTool(Number(b.dataset.c),b.dataset.s,Number(b.dataset.t)),used=new Set(t.compatibility.flatMap(r=>r.products)),available=CAD_PRODUCTS.find(p=>!used.has(p));if(!available)return alert('All products are already assigned to compatibility rows.');t.compatibility.push({products:[available],minimumYear:2020,maximumYear:null});syncJson();render()});document.querySelectorAll('[data-remove-compat]').forEach(b=>b.onclick=()=>{const t=getTool(Number(b.dataset.c),b.dataset.s,Number(b.dataset.t));if(t.compatibility.length===1)return;t.compatibility.splice(Number(b.dataset.r),1);syncJson();render()});document.querySelectorAll('[data-windows]').forEach(i=>i.onchange=()=>{const t=getTool(Number(i.dataset.c),i.dataset.s,Number(i.dataset.t)),set=new Set(t.windowsSupport||[]);i.checked?set.add(i.dataset.windows):set.delete(i.dataset.windows);if(!set.size){i.checked=true;return alert('At least one Windows version must remain selected.')}t.windowsSupport=WINDOWS_VERSIONS.filter(v=>set.has(v));syncJson()})}
function changeProduct(i){const t=getTool(Number(i.dataset.c),i.dataset.s,Number(i.dataset.t)),ri=Number(i.dataset.r),r=t.compatibility[ri],p=i.dataset.compatProduct,usedElsewhere=t.compatibility.some((x,index)=>index!==ri&&x.products.includes(p));if(i.checked&&usedElsewhere){i.checked=false;return alert(`${p} is already assigned to another compatibility row.`)}const set=new Set(r.products);i.checked?set.add(p):set.delete(p);if(!set.size){i.checked=true;return alert('Each compatibility row must include at least one product.')}r.products=CAD_PRODUCTS.filter(x=>set.has(x));syncJson()}
function setActive(id){active=id;document.querySelectorAll('[data-tab],[data-view]').forEach(x=>x.classList.toggle('active',(x.dataset.tab||x.dataset.view)===id));render()}document.querySelectorAll('[data-tab],[data-view]').forEach(x=>x.onclick=()=>setActive(x.dataset.tab||x.dataset.view));$('search').oninput=render;$('collapse').onclick=()=>{openSubcategories.clear();document.querySelectorAll('.subcat').forEach(x=>x.classList.remove('open'))};$('jsonToggle').onclick=()=>{$('shell').classList.toggle('json-open');$('jsonToggle').textContent=$('shell').classList.contains('json-open')?'Hide JSON':'Show JSON'};syncJson();$('json').oninput=()=>{try{manifest=normalizeManifest(JSON.parse($('json').value));$('valid').textContent='● Valid JSON';$('valid').style.color='var(--green)';render()}catch(e){$('valid').textContent='● Invalid JSON';$('valid').style.color='var(--red)'}};$('backBtn').onclick=()=>location.href='editor.html';$('commitBtn').onclick=()=>alert('Mockup only: manifest GitHub commit will be connected next.');$('addSub').onclick=()=>alert('Subcategory creation modal comes next.');$('addTool').onclick=()=>alert('Tool creation modal comes next.');render();
</script></body></html>
