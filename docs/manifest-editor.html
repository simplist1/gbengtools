<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geodeta Suite Manifest Editor</title>
<style>
:root{--bg:#0d0f0f;--panel:#141716;--panel2:#191d1b;--line:#2a2f2c;--text:#f2f4f3;--muted:#929a95;--accent:#e69b22;--green:#34d399;--red:#ef4444}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 18% 0%,rgba(230,155,34,.08),transparent 28%),var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.topbar{height:62px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:rgba(13,15,15,.95)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:12px;height:12px;border-radius:3px;background:var(--accent);box-shadow:0 0 20px rgba(230,155,34,.45)}
.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:9px;font-weight:700}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#211708;border-color:#efb65a}
.shell{height:calc(100vh - 62px);display:grid;grid-template-columns:240px minmax(0,1fr) 0;transition:grid-template-columns .28s ease}.shell.json-open{grid-template-columns:240px minmax(0,1fr) 430px}
.sidebar{border-right:1px solid var(--line);background:#101211;padding:18px;overflow:auto}.side-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:10px 0 8px}
.nav{padding:10px 12px;border-radius:9px;color:#c6cdc9;margin:4px 0;display:flex;justify-content:space-between}.nav.active,.nav:hover{background:#1b1f1d;color:white}.badge{font-size:11px;background:#292f2c;padding:3px 7px;border-radius:999px}
.search{width:100%;background:#0b0d0c;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px}
.main{overflow:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}h1{margin:0 0 6px;font-size:31px}.sub{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.tab{height:132px;border:0;border-radius:14px;background:#171a18;color:var(--text);text-align:left;padding:17px}.tab.active{background:#26212c;outline:1px solid rgba(230,155,34,.35)}.tab-icon{width:42px;height:42px;border-radius:11px;background:#292533;color:#ffc36b;display:grid;place-items:center;font-weight:900}.tab h3{margin:12px 0 4px}.tab p{margin:0;color:var(--muted);font-size:13px}
.panel{background:#121513;border:1px solid var(--line);border-radius:15px;padding:16px}.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.panel-head h2{margin:0}
.subcat{border-radius:12px;background:#171b18;margin:9px 0;overflow:hidden;border:1px solid transparent}.subcat.open{border-color:#343b37}.subcat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;cursor:pointer}.subcat-title{display:flex;gap:10px;align-items:center}.arrow{transition:.2s}.subcat.open .arrow{transform:rotate(90deg)}.subcat-body{display:none;padding:0 12px 12px}.subcat.open .subcat-body{display:block}
.tool-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:center;background:#121513;border-radius:10px;padding:13px;margin-top:9px}.checkbox{width:22px;height:22px;border-radius:6px;background:#0d100e;border:1px solid #343b37}.tool-row h4{margin:0 0 3px}.meta{font-size:12px;color:var(--muted)}.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.tag{font-size:11px;background:#272d29;border-radius:6px;padding:5px 7px}
.json-panel{border-left:1px solid var(--line);background:#090b0a;min-width:0;overflow:hidden;display:flex;flex-direction:column}.json-head{height:52px;border-bottom:1px solid var(--line);padding:0 14px;display:flex;justify-content:space-between;align-items:center}.json-head strong{font-family:Consolas,monospace;color:#ffc36b}.valid{font-size:11px;color:var(--green)}textarea{flex:1;resize:none;border:0;outline:0;background:#090b0a;color:#d7ded9;padding:15px;font:13px/1.55 Consolas,monospace}.json-foot{border-top:1px solid var(--line);padding:11px 14px;color:var(--muted);font-size:12px}
.page-reveal{position:fixed;inset:0;z-index:9999;pointer-events:none;overflow:hidden}.reveal-black,.reveal-orange{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(0)}.reveal-black{background:#050606;z-index:2;animation:revealUp .72s .18s cubic-bezier(.76,0,.24,1) forwards}.reveal-orange{background:var(--accent);z-index:1;animation:revealUp .72s .30s cubic-bezier(.76,0,.24,1) forwards}@keyframes revealUp{to{transform:translateY(-100%)}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand"><div class="mark"></div>Geodeta Suite Manifest Editor</div>
<div class="actions">
<button class="btn" id="backBtn">Back to Site Editor</button>
<button class="btn" id="jsonToggle">Show JSON</button>
<button class="btn primary" id="commitBtn">Commit manifest.json</button>
</div>
</header>
<div class="shell" id="shell">
<aside class="sidebar">
<div class="side-title">Repository</div><div class="nav active">simplist1/gbengtools <span class="badge">main</span></div>
<div class="side-title">Search</div><input id="search" class="search" placeholder="Search tools...">
<div class="side-title">Categories</div>
<div class="nav active" data-view="plugins">Plugins <span class="badge">4</span></div>
<div class="nav" data-view="scripts">Scripts <span class="badge">6</span></div>
<div class="nav" data-view="apps">Apps <span class="badge">1</span></div>
<button class="btn primary" style="width:100%;margin-top:18px" id="addSub">+ Add subcategory</button>
<button class="btn" style="width:100%;margin-top:8px" id="addTool">+ Add tool</button>
</aside>
<main class="main">
<div class="hero"><div><h1>Installer library</h1><div class="sub">Manage plugin, script, and app compatibility.</div></div></div>
<div class="tabs">
<button class="tab active" data-tab="plugins"><div class="tab-icon">PL</div><h3>Plugins</h3><p>AutoCAD add-ins and plugin families</p></button>
<button class="tab" data-tab="scripts"><div class="tab-icon">SC</div><h3>Scripts</h3><p>Drafting, point, and miscellaneous utilities</p></button>
<button class="tab" data-tab="apps"><div class="tab-icon">AP</div><h3>Apps</h3><p>Standalone applications</p></button>
</div>
<section class="panel"><div class="panel-head"><h2 id="title">Plugins</h2><button class="btn" id="collapse">Collapse all</button></div><div id="content"></div></section>
</main>
<aside class="json-panel"><div class="json-head"><strong>manifest.json</strong><span class="valid" id="valid">● Valid JSON</span></div><textarea id="json"></textarea><div class="json-foot">Mockup only. GitHub save endpoint comes next.</div></aside>
</div>
<div class="page-reveal"><div class="reveal-orange"></div><div class="reveal-black"></div></div>
<script>
let manifest={schemaVersion:1,categories:[
{id:"plugins",name:"Plugins",subcategories:[{id:"any2dxf",name:"Any2DXF",tools:[
{id:"any2dxf-vba",name:"Any2DXF for AutoCAD 2000 and up",version:"1.3.0",runtime:"VBA",products:["AutoCAD","Civil 3D","Land Desktop"],minimumYear:2000,maximumYear:2026},
{id:"any2dxf-net47",name:"Any2DXF for AutoCAD 2020",version:"2.1.0",runtime:".NET 4.7",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:2020},
{id:"any2dxf-net10",name:"Any2DXF for AutoCAD 2027",version:"3.0.0",runtime:".NET 10",products:["AutoCAD","Civil 3D"],minimumYear:2027,maximumYear:2027},
{id:"any2dxf-lt",name:"Any2DXF LT for AutoCAD LT 2024",version:"1.0.0",runtime:"LISP",products:["AutoCAD LT"],minimumYear:2024,maximumYear:null}]}]},
{id:"scripts",name:"Scripts",subcategories:[
{id:"drafting-utilities",name:"Drafting Utilities",tools:[{id:"contour-labels",name:"Polyline Contour Labels",version:"1.0.0",runtime:"LISP",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:null},{id:"quick-text",name:"Quick Text Style Changer",version:"1.0.0",runtime:"LISP",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:null}]},
{id:"point-utilities",name:"Point Utilities",tools:[{id:"keyzone",name:"KeyZone Helper",version:"1.0.0",runtime:"LISP",products:["Civil 3D"],minimumYear:2020,maximumYear:null},{id:"quick-10",name:"Quick 10 Scale",version:"1.0.0",runtime:"LISP",products:["Civil 3D"],minimumYear:2020,maximumYear:null}]},
{id:"miscellaneous",name:"Miscellaneous",tools:[{id:"least-squares",name:"Least Squares Adjust Objects",version:"1.0.0",runtime:"LISP",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:null},{id:"easy-spacing",name:"Easy Spacing",version:"1.0.0",runtime:"LISP",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:null}]}]},
{id:"apps",name:"Apps",tools:[{id:"icon-studio",name:"AutoCAD Icon Studio",version:"1.0.0",runtime:".NET",products:["AutoCAD","Civil 3D"],minimumYear:2020,maximumYear:null}]}
]};
let active="plugins";const $=id=>document.getElementById(id),category=id=>manifest.categories.find(c=>c.id===id);
function years(t){return t.maximumYear?`${t.minimumYear}–${t.maximumYear}`:`${t.minimumYear}+`}
function row(t){return `<div class="tool-row"><div class="checkbox"></div><div><h4>${t.name}</h4><div class="meta">${t.runtime} · v${t.version}</div></div><div class="tags">${t.products.map(p=>`<span class="tag">${p}</span>`).join("")}<span class="tag">${years(t)}</span></div></div>`}
function render(){const c=category(active),q=$("search").value.toLowerCase();$("title").textContent=c.name;if(active==="apps"){const tools=c.tools.filter(t=>t.name.toLowerCase().includes(q));$("content").innerHTML=tools.map(row).join("")}else{$("content").innerHTML=c.subcategories.map(s=>{const tools=s.tools.filter(t=>t.name.toLowerCase().includes(q));if(q&&!tools.length&&!s.name.toLowerCase().includes(q))return"";return `<div class="subcat"><div class="subcat-head"><div class="subcat-title"><span class="arrow">▶</span><strong>${s.name}</strong><span class="badge">${tools.length}</span></div><span class="meta">${s.id}</span></div><div class="subcat-body">${tools.map(row).join("")}</div></div>`}).join("");document.querySelectorAll(".subcat-head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"))}}
function setActive(id){active=id;document.querySelectorAll("[data-tab],[data-view]").forEach(x=>x.classList.toggle("active",(x.dataset.tab||x.dataset.view)===id));render()}
document.querySelectorAll("[data-tab],[data-view]").forEach(x=>x.onclick=()=>setActive(x.dataset.tab||x.dataset.view));$("search").oninput=render;$("collapse").onclick=()=>document.querySelectorAll(".subcat").forEach(x=>x.classList.remove("open"));
$("jsonToggle").onclick=()=>{$("shell").classList.toggle("json-open");$("jsonToggle").textContent=$("shell").classList.contains("json-open")?"Hide JSON":"Show JSON"};
$("json").value=JSON.stringify(manifest,null,2);$("json").oninput=()=>{try{manifest=JSON.parse($("json").value);$("valid").textContent="● Valid JSON";$("valid").style.color="var(--green)";render()}catch(e){$("valid").textContent="● Invalid JSON";$("valid").style.color="var(--red)"}};
$("backBtn").onclick=()=>location.href="editor.html";$("commitBtn").onclick=()=>alert("Mockup only: manifest GitHub commit will be connected next.");$("addSub").onclick=()=>alert("Subcategory creation modal comes next.");$("addTool").onclick=()=>alert("Tool creation modal comes next.");render();
</script>
</body>
</html>
