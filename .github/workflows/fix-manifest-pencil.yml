name: Fix manifest pencil icon

on:
  push:
    branches: [main]
    paths:
      - docs/pencil.svg

permissions:
  contents: write

jobs:
  patch-manifest-editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point manifest editor at pencil asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/manifest-editor.html')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"const PENCIL='data:image/svg\+xml;base64,[^']*';",
              "const PENCIL='pencil.svg';",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not find the PENCIL data URI to replace.')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manifest-editor.html
          git commit -m "Use uploaded white pencil icon in manifest editor"
          git push
